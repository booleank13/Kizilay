<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kızılay Playable Interstitial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <!-- Logo -->
        <div id="logo-container">
            <img src="assets/logo.png" alt="Türk Kızılay" id="kizilay-logo" style="display: none;">
        </div>

        <!-- Prompt Text / Result Text -->
        <div id="text-container">
            <h2 id="prompt-text">Hangi ildensin?</h2>
        </div>

        <!-- Map Container -->
        <div id="map-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" style="background-color:#fff;">
              <!-- Rough Turkey Outline (Background) - Not clickable but visual -->
              <path d="M 50 150 L 250 50 L 950 50 L 980 250 L 900 450 L 550 480 L 250 420 L 20 300 Z" fill="#eee" stroke="#ccc" stroke-width="2" pointer-events="none" />

              <!-- Cities (Clickable) -->
              <circle id="TR-34" cx="200" cy="120" r="35" class="city" /> <!-- Istanbul -->
              <text x="200" y="125" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">34</text>

              <circle id="TR-06" cx="400" cy="200" r="35" class="city" /> <!-- Ankara -->
              <text x="400" y="205" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">06</text>

              <circle id="TR-35" cx="100" cy="250" r="35" class="city" /> <!-- Izmir -->
              <text x="100" y="255" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">35</text>

              <circle id="TR-07" cx="300" cy="400" r="35" class="city" /> <!-- Antalya -->
              <text x="300" y="405" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">07</text>

              <circle id="TR-01" cx="550" cy="380" r="35" class="city" /> <!-- Adana -->
              <text x="550" y="385" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">01</text>

              <circle id="TR-61" cx="750" cy="100" r="35" class="city" /> <!-- Trabzon -->
              <text x="750" y="105" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">61</text>

              <circle id="TR-21" cx="800" cy="300" r="35" class="city" /> <!-- Diyarbakir -->
              <text x="800" y="305" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">21</text>

              <circle id="TR-65" cx="900" cy="250" r="35" class="city" /> <!-- Van -->
              <text x="900" y="255" text-anchor="middle" font-size="14" fill="#fff" pointer-events="none" font-weight="bold">65</text>
            </svg>
        </div>

        <!-- Action Button -->
        <div id="button-container">
            <a href="https://www.kizilay.org.tr/ms/asevi/?utm_source=Halktv&utm_medium=masthead&utm_campaign=asevibagisi&utm_id=Kizilay&utm_term=Ocak2026" target="_blank" id="donate-btn" style="display: none;">BAĞIŞ YAP</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
